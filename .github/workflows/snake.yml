name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main
    - master

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # Cria a pasta dist caso não exista
      - name: Create dist directory
        run: mkdir -p dist

      # Gera a cobrinha e salva na pasta dist/
      - uses: TroniPM/snk@main
        with:
          github_user_name: tronipm
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gera os troféus e salva na pasta dist/
      - name: Generate trophy card
        uses: TroniPM/github-profile-trophy-action@main
        with:
          options: 'username=tronipm&theme=transparent&no-frame=true&no-bg=true&row=2&column=4&margin-w=15&margin-h=15'
          path: 'dist/trophy.svg'

      # Gera o card de estatísticas do GitHub (inclui dados privados via PAT)
      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=tronipm&show_icons=true&theme=transparent&hide_border=true&count_private=true'
          path: dist/github-stats.svg
          token: ${{ secrets.PAT }}

      # Gera o card de linguagens mais usadas
      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=tronipm&layout=compact&theme=transparent&hide_border=true&exclude_repo=DarkEden-With-Docker,opendarkeden_server,darkclient_1,DarkEden-Client-on-Linux,darkserver_1,darkeden-v2-serverfiles,darkeden-v2-clientfiles,ExtractData'
          path: dist/top-langs.svg
          token: ${{ secrets.PAT }}

      # Envia todos os arquivos da pasta dist/ para a branch output
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
